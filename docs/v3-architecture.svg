  <text x="800" y="730" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">X LAYER MAINNET  ·  CHAIN ID 196</text>

  <!-- 4 chain destinations -->
  <rect x="100" y="745" width="320" height="80" rx="10" fill="#0f1525" stroke="#ff007a" stroke-width="1"/>
  <text x="260" y="775" text-anchor="middle" font-size="18" font-weight="700" fill="#ff007a">Uniswap V3</text>
  <text x="260" y="797" text-anchor="middle" font-size="12" fill="#94a3b8">NPM.mint · collect · rebalance</text>
  <text x="260" y="813" text-anchor="middle" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">NFT #962 live</text>

  <rect x="450" y="745" width="320" height="80" rx="10" fill="#0f1525" stroke="#3b82f6" stroke-width="1"/>
  <text x="610" y="775" text-anchor="middle" font-size="18" font-weight="700" fill="#3b82f6">Aave V3</text>
  <text x="610" y="797" text-anchor="middle" font-size="12" fill="#94a3b8">supply · withdraw · borrow</text>
  <text x="610" y="813" text-anchor="middle" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">v3 NEW path</text>

  <rect x="800" y="745" width="320" height="80" rx="10" fill="#0f1525" stroke="#00ffa3" stroke-width="1"/>
  <text x="960" y="775" text-anchor="middle" font-size="18" font-weight="700" fill="#00ffa3">OKX DEX</text>
  <text x="960" y="797" text-anchor="middle" font-size="12" fill="#94a3b8">aggregator · cross-DEX routing</text>
  <text x="960" y="813" text-anchor="middle" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">via OnchainOS</text>

  <rect x="1150" y="745" width="350" height="80" rx="10" fill="#0f1525" stroke="#fbbf24" stroke-width="1"/>
  <text x="1325" y="775" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Audit Contracts</text>
  <text x="1325" y="797" text-anchor="middle" font-size="12" fill="#94a3b8">DecisionLogger · x402PaymentLog</text>
  <text x="1325" y="813" text-anchor="middle" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">FollowVaultFactory · StrategyManager</text>

  <!-- Footer -->
  <text x="800" y="875" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    github.com/dddd86971-cloud/yield-agent  ·  frontend-nine-theta-22.vercel.app  ·  #BuildXAI #XLayer
  </text>
</svg>
